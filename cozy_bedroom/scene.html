function neonTube(points, color, x, y, radius = 0.014) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], 0)), true, 'catmullrom', 0.05);
  const g = new THREE.Group(); g.position.set(x, y, WALL_Z + 0.05); bg.add(g);
  const core = new THREE.Mesh(new THREE.TubeGeometry(curve, 400, radius, 12, true), glow(0xffffff, 1.0));
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 400, radius * 2.1, 12, true),
    new THREE.MeshBasicMaterial({ color, toneMapped: false, transparent: true, opacity: 0.85 }));
  core.material.color.set(color).lerp(new THREE.Color(0xffffff), 0.55);

}

  return p;
}

function skylineTexture() {
  const c = document.createElement('canvas'); c.width = 2048; c.height = 1792;
  const g = c.getContext('2d'), w = c.width, h = c.height;
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#081a55'); sky.addColorStop(0.5, '#152d7c'); sky.addColorStop(0.8, '#43347f'); sky.addColorStop(1, '#7a3f78');
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  // stars
  for (let i = 0; i < 160; i++) { g.fillStyle = `rgba(255,255,255,${rr(0.25, 0.9)})`; g.beginPath(); g.arc(rr(0, w), rr(0, h * 0.6), rr(0.8, 2.4), 0, 7); g.fill(); }
  // moon glow + crescent
  const mx = w * 0.66, my = h * 0.2, mr = 105;
  const mg = g.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 5);
  mg.addColorStop(0, 'rgba(190,210,255,0.5)'); mg.addColorStop(1, 'rgba(190,210,255,0)');
  g.fillStyle = mg; g.fillRect(0, 0, w, h);
  const mc = document.createElement('canvas'); mc.width = mc.height = 400; const m = mc.getContext('2d');
  m.fillStyle = '#fffbe6'; m.beginPath(); m.arc(200, 200, mr, 0, 7); m.fill();
  m.globalCompositeOperation = 'destination-out'; m.beginPath(); m.arc(200 + mr * 0.5, 200 - mr * 0.22, mr * 0.92, 0, 7); m.fill();
  g.drawImage(mc, mx - 200, my - 200);
  // skyline: two layers of towers
  for (let layer = 0; layer < 2; layer++) {
    let x = -20;
    while (x < w) {
      const bw = rr(70, 190), bh = (layer ? rr(0.16, 0.44) : rr(0.3, 0.6)) * h;
      g.fillStyle = layer ? '#0a0b22' : '#1a1c48';
      g.fillRect(x, h - bh, bw, bh);
      if (rnd() < 0.3) g.fillRect(x + bw * 0.45, h - bh - rr(30, 110), 6, 120);   // antenna
      for (let wy = h - bh + 16; wy < h - 10; wy += 26)
        for (let wx = x + 12; wx < x + bw - 16; wx += 24)
          if (rnd() < (layer ? 0.42 : 0.3)) {
            g.fillStyle = ['#ffcf7a', '#ffb155', '#ffe2a8', '#ff9d5c', '#bfd4ff'][Math.floor(rnd() * 5)];
            g.globalAlpha = rr(0.55, 1); g.fillRect(wx, wy, 12, 14); g.globalAlpha = 1;
          }
      x += bw + rr(-10, 26);
    }
  }
  // warm bokeh discs
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 150; i++) {
    const x = rr(0, w), y = h - Math.pow(rnd(), 1.6) * h * 0.6, r = rr(14, 46);
    const col = [[255, 176, 84], [255, 205, 120], [255, 138, 76], [255, 120, 170], [150, 180, 255]][Math.floor(rnd() * 5)];
    const a = rr(0.12, 0.42);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(0.82, `rgba(${col},${a})`); gr.addColorStop(0.92, `rgba(${col},${a * 1.5})`); gr.addColorStop(1, `rgba(${col},0)`);
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

function pageTexture() {

  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

function spot(color, intensity, pos, target, angle = 0.6, shadow = true) {
  const s = new THREE.SpotLight(color, intensity, 0, angle, 0.8, 1.6);
  s.position.set(...pos); s.target.position.set(...target); scene.add(s, s.target);
  if (shadow) { s.castShadow = true; s.shadow.mapSize.set(2048, 2048); s.shadow.radius = 9; s.shadow.bias = -0.0004; s.shadow.camera.near = 0.3; s.shadow.camera.far = 8; }
  return s;
}

// neon reflection strips for the glossy desk (cheap fake of screen-space reflections)
const reflMats = [];
function reflection(color, x, w, d, op) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), new THREE.MeshBasicMaterial({
    map: new THREE.CanvasTexture(c), color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, toneMapped: false }));
  m.rotation.x = -Math.PI / 2; m.position.set(x, DESK_Y + 0.0005, DZ0 + d / 2 - 0.05); fg.add(m); reflMats.push(m);
}
reflection(0xff8a2a, -1.05, 0.5, 0.8, 0.2);

  bg.visible = which !== 'fg';

  return renderer.domElement.toDataURL('image/png');
};
